<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; worker-src blob:; connect-src 'none'; object-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrode EDS Analyzer</title><style>/* Neutral zinc surfaces, one accent for state (the current step, focus), and the element colours
   kept for data. The image area is dark so element maps read as they do in the EDS software. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --subtle: #fafafa;
  --line: #e4e4e7;
  --line-2: #d4d4d8;
  --ink: #18181b;
  --ink-2: #52525b;
  --ink-3: #71717a;
  --ink-4: #a1a1aa;
  --accent: #047857;
  --accent-soft: #e6f3ee;
  --warn: #92400e;
  --warn-soft: #fef6e7;
  --warn-line: #f0d29a;
  --error: #b91c1c;
  --viewer: #1c1c1f;
  --viewer-2: #27272a;
  --viewer-line: #34343a;
  --viewer-ink: #d4d4d8;
  --radius: 6px;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  font:
    13px/1.5 system-ui,
    -apple-system,
    'Segoe UI',
    'PingFang TC',
    'Microsoft JhengHei',
    'Noto Sans TC',
    sans-serif;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button,
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  white-space: nowrap;
  transition:
    background-color 0.15s var(--ease),
    border-color 0.15s var(--ease),
    transform 0.15s var(--ease);
}
button:hover,
.button:hover {
  border-color: var(--ink-4);
  background: var(--subtle);
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
button.primary:hover {
  background: #27272a;
}
button.ghost,
button.quiet {
  border-color: transparent;
  background: transparent;
  color: var(--ink-2);
}
button.ghost:hover,
button.quiet:hover {
  background: var(--bg);
  border-color: transparent;
  color: var(--ink);
}
button.small,
.button.small {
  min-height: 26px;
  padding: 0 8px;
  font-size: 12px;
  gap: 4px;
}
.icon-only {
  padding: 0 !important;
  width: 32px;
}
.small.icon-only {
  width: 26px;
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
.icon {
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon circle {
  fill: currentColor;
  stroke: none;
}
select,
input[type='text'],
input[type='number'],
input:not([type]) {
  min-height: 32px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 0 9px;
}
select {
  padding-right: 6px;
}
input:focus-visible,
select:focus-visible,
button:focus-visible,
.button:focus-within,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
input[type='range'] {
  accent-color: var(--ink-2);
  width: 100%;
}
input[type='checkbox'] {
  accent-color: var(--accent);
  margin: 0;
}
h2 {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  letter-spacing: 0.01em;
}
h3 {
  font-size: 12px;
  margin: 18px 0 8px;
  color: var(--ink-3);
  font-weight: 600;
}

/* Top bar: name and sample, the three steps, project actions. */
.topbar {
  height: 52px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 16px;
  padding: 0 12px 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand .mark rect {
  fill: var(--ink);
}
.brand strong {
  font-size: 14px;
  white-space: nowrap;
}
.brand .sep {
  width: 1px;
  height: 18px;
  background: var(--line-2);
  flex: none;
}
#sample {
  min-width: 80px;
  width: 200px;
  border-color: transparent;
  color: var(--ink-2);
  background: transparent;
  padding: 0 7px;
}
#sample:hover {
  border-color: var(--line-2);
}
.stepper {
  display: flex;
  align-items: center;
  gap: 4px;
}
.stepper .link {
  width: 20px;
  height: 1px;
  background: var(--line-2);
}
.stepper button {
  border: 0;
  border-radius: 16px;
  min-height: 32px;
  padding: 0 12px 0 6px;
  gap: 8px;
  background: none;
  color: var(--ink-3);
}
.stepper button:hover {
  background: var(--bg);
  color: var(--ink);
}
.stepper .n {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  font: 600 11px var(--mono);
  transition: background-color 0.2s var(--ease);
}
.stepper .done {
  color: var(--ink-2);
}
.stepper .done .n {
  background: var(--ink-2);
  border-color: var(--ink-2);
  color: #fff;
}
.stepper .active {
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
}
.stepper .active .n {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  min-width: 0;
}
select.quiet {
  border-color: transparent;
  background: transparent;
  color: var(--ink-2);
}
.menu-wrap {
  position: relative;
}
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 20;
  min-width: 190px;
  display: grid;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 12px 32px -12px #18181b40;
}
.menu button {
  justify-content: flex-start;
  border: 0;
  background: none;
}
.menu button:hover {
  background: var(--bg);
}

/* Three columns: step panel, image, results. The results column is only there for the analysis. */
main {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr) 0;
  height: calc(100vh - 52px - 28px);
}
main[data-stage='analyze'] {
  grid-template-columns: 296px minmax(0, 1fr) 320px;
}
main:not([data-stage='analyze']) aside.right {
  display: none;
}
main.collapsed[data-stage='analyze'] {
  grid-template-columns: 296px minmax(0, 1fr) 44px;
}
main.collapsed .right > *:not(#collapse) {
  display: none;
}
aside {
  overflow: auto;
  background: var(--surface);
}
aside.left {
  border-right: 1px solid var(--line);
}
aside.right {
  position: relative;
  border-left: 1px solid var(--line);
}
#controls {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding: 18px 18px 0;
}
#controls > h2 {
  display: flex;
  align-items: center;
  gap: 6px;
}
.hint {
  margin: 4px 0 16px;
  color: var(--ink-3);
  font-size: 12px;
}
.panel-foot {
  position: sticky;
  bottom: 0;
  margin: auto -18px 0;
  padding: 14px 18px 18px;
  background: linear-gradient(to bottom, #ffffff00, var(--surface) 14px);
}
.full {
  width: 100%;
}
label.field {
  display: block;
  margin: 0 0 14px;
  font-size: 12px;
  color: var(--ink-2);
}
label.field .info {
  margin-left: 4px;
}
label.field > :is(input, select) {
  display: block;
  width: 100%;
  margin-top: 6px;
  color: var(--ink);
  font-size: 13px;
}
.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
label.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0;
}
.button-row {
  display: flex;
  gap: 6px;
  margin: 8px 0;
}
.button-row > * {
  flex: 1;
  min-width: 0;
}
.group-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 18px 0 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.04em;
}
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 2px;
  background: var(--bg);
  border-radius: 7px;
}
.seg button {
  min-height: 28px;
  border: 0;
  background: none;
  color: var(--ink-2);
  border-radius: 5px;
}
.seg button.active,
.seg button.on {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow:
    0 1px 2px #18181b1f,
    0 0 0 1px #18181b0a;
}
details {
  margin: 8px 0 0;
  padding: 12px 0 4px;
  border-top: 1px solid var(--line);
}
summary {
  cursor: pointer;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
  list-style-position: inside;
}
details[open] > summary {
  margin-bottom: 10px;
}
.compare {
  border-top: 1px solid var(--line);
  margin-top: 12px;
}
.warning {
  margin: 8px 0;
  padding: 8px 10px;
  border-radius: var(--radius);
  background: var(--warn-soft);
  color: var(--warn);
  font-size: 12px;
}
.info {
  width: 16px;
  min-height: 16px !important;
  height: 16px;
  padding: 0 !important;
  border: 1px solid var(--ink-4) !important;
  border-radius: 50%;
  background: transparent !important;
  color: var(--ink-3) !important;
  font: 600 10px/1 var(--mono);
  cursor: help;
  flex: none;
  vertical-align: 1px;
}
.info:hover {
  border-color: var(--ink-2) !important;
  color: var(--ink) !important;
}
#tooltip {
  position: fixed;
  z-index: 30;
  max-width: 300px;
  padding: 9px 11px;
  border-radius: var(--radius);
  background: var(--ink);
  color: #f4f4f5;
  font-size: 12px;
  line-height: 1.55;
  box-shadow: 0 12px 28px -10px #18181b80;
  pointer-events: none;
}
#tooltip.pinned {
  pointer-events: auto;
}

/* Channel rows on the data step. */
.channel {
  margin: 0 0 8px;
  padding: 10px 10px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  transition: border-color 0.15s var(--ease);
}
.channel.loaded {
  background: var(--subtle);
}
.channel.drag,
.channel.paste-target {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.channel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.channel-head strong {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.channel-state {
  margin-left: auto;
  flex: none;
  font: 11px var(--mono);
  color: var(--ink-3);
}
.channel:not(.loaded) .channel-state {
  font-family: inherit;
}
.channel-body {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 0 18px;
  min-width: 0;
}
.channel .filename {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.channel:not(.loaded) .filename {
  display: none;
}
.channel-ops {
  display: flex;
  flex: none;
  gap: 4px;
}
.channel-ops input[type='file'] {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.button {
  position: relative;
}
.swatch {
  display: inline-block;
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

/* Mask legend on the second step. */
.legend {
  border-top: 1px solid var(--line);
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.legend-row {
  cursor: pointer;
}
.legend-row input {
  accent-color: var(--ink-2);
}
.legend-row .coverage {
  margin-left: auto;
  font: 12px var(--mono);
  color: var(--ink-2);
}
.checks {
  margin: 4px 0 8px;
}
.roilist {
  font-size: 12px;
  max-height: 140px;
  overflow: auto;
}
.roi-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 0;
}

/* Image area. */
#workspace {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: var(--viewer);
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 46px;
  padding: 0 12px;
  flex-wrap: nowrap;
  white-space: nowrap;
  border-bottom: 1px solid var(--viewer-line);
  color: var(--viewer-ink);
  font-size: 12px;
}
.toolbar select {
  min-height: 28px;
  border: 0;
  background: var(--viewer-2);
  color: #e4e4e7;
  max-width: 150px;
}
.seg.dark {
  background: var(--viewer-2);
  grid-auto-columns: auto;
}
.seg.dark button {
  color: var(--ink-4);
  min-height: 26px;
  padding: 0 10px;
  font-size: 12px;
}
.seg.dark button:hover {
  color: #fafafa;
}
.seg.dark button.active {
  background: #3f3f46;
  color: #fafafa;
  box-shadow: none;
}
.legend-inline {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  color: var(--ink-4);
}
.legend-inline .swatch {
  margin-right: 5px;
  vertical-align: -1px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: center;
  color: var(--ink-4);
}
.chips label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.chips input {
  accent-color: #a1a1aa;
}
.layer-slot {
  flex: 1;
  min-width: 0;
  display: flex;
  overflow: hidden;
}
.layer-slot > * {
  flex-wrap: nowrap !important;
}
.toolbar .range {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-4);
}
.toolbar .range input {
  width: 84px;
}
.notice {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  padding: 10px 14px;
  background: var(--warn-soft);
  border-bottom: 1px solid var(--warn-line);
  color: var(--warn);
}
.notice button {
  border-color: #d6a34f;
  font-weight: 600;
  min-height: 28px;
}
#viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  touch-action: none;
}
#stage {
  position: relative;
  width: fit-content;
  margin: 24px auto;
}
#canvas {
  display: block;
  max-width: none;
  cursor: crosshair;
  image-rendering: pixelated;
}
#gridOverlay {
  position: absolute;
  inset: 0 0 auto 0;
  pointer-events: none;
}
#gridOverlay .tile {
  position: absolute;
  display: grid;
  place-items: center;
  border: 0.5px solid #ffffff73;
  color: #fff;
  font-family: var(--mono);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-shadow:
    0 0 3px #000,
    0 0 2px #000;
  overflow: hidden;
}
#gridOverlay .tile.selected {
  border: 2px solid #fff;
  box-shadow: inset 0 0 0 2px #18181b99;
}
.under-image {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-top: 10px;
}
#gridCaption {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--viewer-ink);
  font-size: 11px;
}
/* Dimmed, not hidden: the numbers stay readable on the dark masks. */
#gridOverlay.small-cells .tile {
  color: #d4d4d8;
  font-weight: 500;
}
#gridOverlay .tile.hot {
  background: #ffffff38;
  border-color: #fff;
}
.base-pick {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-4);
}
#scaleMark {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--viewer-ink);
  font: 11px var(--mono);
}
#scaleMark .bar {
  display: inline-block;
  height: 2px;
  background: #e4e4e7;
}
.empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
}
.empty.hidden {
  display: none;
}
.empty-card {
  max-width: 420px;
  color: var(--viewer-ink);
}
.empty-card h2 {
  font-size: 18px;
  color: #fafafa;
}
.empty-card p {
  margin: 8px 0 0;
  color: var(--ink-4);
}
.empty-card .fine {
  font-size: 11px;
  color: var(--ink-3);
}
.empty-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
.empty-actions button {
  background: var(--viewer-2);
  border-color: var(--viewer-line);
  color: #e4e4e7;
}
.empty-actions button:hover {
  background: #3f3f46;
  border-color: #52525b;
}
.progress {
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 40% 100%;
  background-repeat: no-repeat;
  animation: slide 1.1s var(--ease) infinite;
}
@keyframes slide {
  from {
    background-position: -40% 0;
  }
  to {
    background-position: 140% 0;
  }
}

/* Trend strip under the image. */
.trends {
  flex: none;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 16px 6px;
  color: var(--ink);
}
.trends-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
  font-size: 12px;
}
.trend-legend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-3);
  font-size: 11px;
}
.trend-legend .key {
  display: inline-block;
  width: 16px;
  margin-left: 8px;
  border-top: 1px solid #a1a1aa;
}
.trend-legend .key.band {
  height: 10px;
  border: 0;
  background: #ececef;
}
.trend-legend .key.mean {
  border-top: 2px solid var(--tint);
  margin-left: 0;
}
.trend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.trend {
  margin: 4px 0 0;
  min-width: 0;
}
.trend figcaption {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--ink-3);
}
.trend figcaption b {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--ink);
}
.trend .band {
  fill: #f4f4f5;
}
.trend .band-edge {
  stroke: #e4e4e7;
}
.trend .band-label {
  font: 10px var(--mono);
  fill: var(--ink-2);
}
.trend .val,
.trend .val-label {
  font: 10px var(--mono);
  fill: var(--ink-3);
}
.trend .val-hot .val,
.trend .val-hot .val-label {
  fill: var(--ink);
}
.trend-plot svg {
  display: block;
  overflow: visible;
}
.trend .gridline {
  stroke: #ececef;
  stroke-width: 1;
}
.trend .tick {
  font: 10px var(--mono);
  fill: var(--ink-3);
}
.trend .series .line {
  fill: none;
  stroke: #a1a1aa;
  stroke-opacity: 0.55;
  stroke-width: 1;
  transition:
    stroke 0.15s var(--ease),
    stroke-opacity 0.15s var(--ease);
}
.trend .series .hit {
  fill: none;
  stroke: transparent;
  stroke-width: 10;
  cursor: default;
}
.trend .series.picked .line {
  stroke: var(--ink-2);
  stroke-opacity: 1;
  stroke-width: 1.5;
}
.trend .series.hot .line {
  stroke: var(--ink);
  stroke-opacity: 1;

let waiter = new Map();
worker.onmessage = ({ data }) => {
  const call = waiter.get(data.id);
  if (!call) return;
  waiter.delete(data.id);
  call(data);

worker.onerror = e => {
  const reason = e.message,
    message = () => t('Background calculation failed') + ': ' + messageText(reason),
    pending = [...waiter.values()];
  // Settle every pending request; otherwise compute() waits forever with the UI marked busy.
  waiter.clear();
  workerSentVersion = -1;
  busy = false;
  $('#progress').classList.add('hidden');
  status(message, true);

async function preview() {

async function compute(analyze = false) {
  if (sizeError()) {
    status(sizeErrorMessage, true);
    return;
  }
  if (!dimensions()) return;
  if (analyze && analysisBlocked().startsWith('Load')) {
    status(analysisBlocked(), true);
    return;
  }
  if (state.settings.ratio && (!state.channels.nmc || !state.channels.secondary)) {
    status('Ratio 需要 Ni 與 Mn map。', true);
    return;
  }
  if (analyze && state.material === 'Al2O3' && state.view === 'cross' && !state.rois.length) {
    status('Al₂O₃ 截面請先設定極層 ROI／排除集流體。', true);
    return;
  }
  const id = ++requestId;
  latest = id;
  const rev = revision;
  busy = true;
  $('#progress').classList.remove('hidden');
  status(analyze ? 'Analyzing…' : 'Segmenting…');
  const start = performance.now();
  const payload = {
    ...dimensions(),
    channels:
      workerSentVersion !== channelVersion
        ? Object.fromEntries(
            Object.entries(state.channels)
              .filter(([k]) => ANALYSIS_KEYS.includes(k))
              .map(([k, ch]) => [k, { data: ch.data }]),
          )
        : null,
    seg: state.seg,
    rois: state.rois,
    roiInvert: state.roiInvert,
    settings: { ...state.settings, view: state.view },
    analyze,
  };
  const response = await new Promise(resolve => {
    waiter.set(id, resolve);
    worker.postMessage({ id, payload });
    workerSentVersion = channelVersion;
  });
  if (id !== latest) return;
  busy = false;
  $('#progress').classList.add('hidden');
  if (response.error) {
    status(response.error, true);
    return;
  }
  if (rev !== revision) {
    status('設定已改變，請重新分析。');
    return;
  }
  masks = response.result.masks;
  segRanges = response.result.ranges;
  effectiveROI = response.result.roi;
  for (const [k, t] of Object.entries(response.result.thresholds)) {
    if (state.seg[k].auto) state.seg[k].threshold = t;
  }
  if (analyze) {
    regionTile = null;
    state.results = response.result.results;
    state.results.elapsedMs = performance.now() - start;
    state.results.analyzedAt = new Date().toISOString();
    state.results.trace = trace();
    // The figures follow an element that was analysed; the first one when the last is gone.
    if (!state.results.elements?.[metric])
      metric = METRIC_KEYS.find(k => state.results.elements?.[k]) || 'secondary';
    renderResults();
    renderControls();
    const elapsed = Math.round(state.results.elapsedMs),
      warnings = [...state.results.warnings];
    status(
      () =>
        `${t('Analysis complete')} · ${elapsed} ms${warnings.length ? ' · ' + warnings.map(messageText).join(' ') : ''}`,
    );
  } else {
    if (step === 'segment') {
      const t = state.seg[selected]?.threshold;
      if ($('#thresholdNumber') && t != null) {
        const range = segRanges[selected];
        if (range) {
          $('#thresholdSlider').min = range.min;
          $('#thresholdSlider').max = range.max === range.min ? range.max + 1 : range.max;
        }
        $('#thresholdNumber').value = Number(t.toPrecision(7));
        $('#thresholdSlider').value = t;
      }
      updateMaskLegend();
    }
    status('Mask updated');
  }
  draw();
}

          offenders: Object.keys(state.channels).filter(
            k => state.channels[k].w !== first.w || state.channels[k].h !== first.h,

      : null;

    if (typeof createImageBitmap === 'function') return await createImageBitmap(file);
  } catch (_) {}
  const url = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(Error('File could not be read'));
    reader.readAsDataURL(file);
  });
  return await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(Error('Image could not be decoded'));
    img.src = url;
  });

    h = 240,

    c = new Float64Array(w * h),

function compareFigure(entry, choice) {
  const [key, name] = choice.split(':'),
    figure = COMPARE_FIGURES.find(f => f[0] === name),
    e = entry.metrics.elements?.[key];

function comparisonChartHTML() {

    ),

}
function bindComparisonChart() {
  $('#compareY').value = compareY;
  $('#compareX').value = compareX;
  $('#compareY').onchange = e => {
    compareY = e.target.value;

/* Round axis bounds covering the values, with a step of 1, 2 or 5 × 10^k. */

  const raw = (max - min) / 4,
    power = 10 ** Math.floor(Math.log10(raw)),
    step = [1, 2, 5, 10].map(m => m * power).find(s => s >= raw);

function drawComparisonChart() {
  const host = $('#compareChart'),
    note = $('#compareNote');

  const rows = state.comparison.map((c, i) => ({
      i,
      name: c.sample,
      y: compareFigure(c, compareY),
      x: compareX === 'sample' ? { value: i } : parseMeasured(c[compareX]),
    })),
    lacking = rows.filter(r => r.y == null).length,
    unreadable = rows.filter(r => r.x.invalid).map(r => r.name),
    points = rows.filter(r => r.y != null && r.x.value != null),
    notes = [];
  if (lacking)
    notes.push(
      t(
        '{k} of {m} samples lack this figure (analysed with an older version or without this element).',

        .replace('{k}', lacking)
        .replace('{m}', rows.length),
    );
  if (unreadable.length)
    notes.push(`${t('Not a plain number, left out')}: ${unreadable.map(esc).join('、')}`);
  const n = points.length;
  if (compareX !== 'sample') notes.push(`n = ${n}`);
  if (compareX !== 'sample' && n >= 4) {
    const r = Core.pearson(
      Float64Array.from(points, p => p.x.value),
      Float64Array.from(points, p => p.y),
      new Uint8Array(n).fill(1),
    );
    notes.push(`${t('Pearson r')} = ${fmt(r)}`);
  } else if (compareX !== 'sample' && n) notes.push(t('A correlation needs at least 4 samples.'));
  note.innerHTML = notes.join(' · ');
  if (!n) {
    host.innerHTML = `<div class="compare-empty">${t(compareX === 'sample' ? 'No sample has this figure yet.' : 'Type numbers into the column above to plot against them.')}</div>`;
    return;
  }
  const w = Math.max(420, Math.min(760, host.clientWidth || 640)),
    h = 260,
    left = 56,
    right = 16,
    top = 14,
    bottom = compareX === 'sample' ? 52 : 40,
    ys = niceAxis(Math.min(0, ...points.map(p => p.y)), Math.max(...points.map(p => p.y))),
    xs =
      compareX === 'sample'
        ? null
        : niceAxis(
            Math.min(...points.map(p => p.x.value)),
            Math.max(...points.map(p => p.x.value)),

    sx = p =>
      compareX === 'sample'
        ? left + ((p.i + 0.5) / rows.length) * (w - left - right)
        : left + ((p.x.value - xs.min) / (xs.max - xs.min)) * (w - left - right),
    sy = v => top + (1 - (v - ys.min) / (ys.max - ys.min)) * (h - top - bottom),
    digits = v => Number(v.toPrecision(6)),

  for (let v = ys.min; v <= ys.max + ys.step / 2; v += ys.step)
    svg += `<line class="gridline" x1="${left}" x2="${w - right}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tick" x="${left - 6}" y="${sy(v) + 3}" text-anchor="end">${digits(v)}</text>`;
  if (compareX === 'sample')
    rows.forEach(r => {
      const x = sx(r),

      svg += `<text class="tick" x="${x}" y="${h - bottom + 16}" text-anchor="middle">${esc(label)}</text>`;
    });
  else {
    for (let v = xs.min; v <= xs.max + xs.step / 2; v += xs.step) {
      const x = left + ((v - xs.min) / (xs.max - xs.min)) * (w - left - right);
      svg += `<line class="axis-tick" x1="${x}" x2="${x}" y1="${h - bottom}" y2="${h - bottom + 4}"/><text class="tick" x="${x}" y="${h - bottom + 16}" text-anchor="middle">${digits(v)}</text>`;
    }

  }
  svg += `<line class="axis" x1="${left}" x2="${w - right}" y1="${h - bottom}" y2="${h - bottom}"/>`;
  for (const p of points)
    svg += `<g class="compare-point"><circle cx="${sx(p)}" cy="${sy(p.y)}" r="5" style="fill:${CHART_TINT[key]}"/><title>${esc(p.name)}: ${fmt(p.y)}</title>${compareX === 'sample' ? '' : `<text class="point-label" x="${sx(p) + 8}" y="${sy(p.y) + 3}">${esc(p.name.length > 12 ? p.name.slice(0, 11) + '…' : p.name)}</text>`}</g>`;
  host.innerHTML = svg + '</svg>';
}

/* One-page report figure, laid out as a double-column journal figure: 180 mm wide at 300 dpi,
   text at 7–10 pt, hairline axes. Panels a–c are the element masks with their grid shares,
   d the figures of each element, e and f the column and row profiles; a caption with the

const REPORT = {

  ink: '#111111',
  soft: '#555555',

}
/* Breaks text into lines that fit; Latin text breaks at spaces, CJK text between characters. */
function wrapText(ctx, text, width) {

    if (line && ctx.measureText(line + token).width > width) {

function maskImage(key) {

    grey = sem || state.channels.nmc,
    range = Core.range(grey.data),

  canvas.height = h;

    max = Math.ceil(top / step) * step,
    plot = {
      x: box.x + pt(28),
      y: box.y + pt(30),
      w: box.w - pt(32),
      h: box.h - pt(30) - pt(26),
    },
    sx = i => plot.x + ((i + 0.5) / n) * plot.w,
    sy = v => plot.y + plot.h - (v / max) * plot.h;
  ctx.fillStyle = REPORT.ink;
  ctx.font = reportFont(10, 700);
  ctx.fillText(letter, box.x, box.y + pt(10));
  ctx.font = reportFont(8, 700);
  ctx.fillText(title, box.x + pt(12), box.y + pt(10));
  // Legend in one row, swatch and marker beside ink text.
  let lx = box.x + pt(12);
  ctx.font = reportFont(7);
  for (const s of series) {
    ctx.fillStyle = CHART_TINT[s.k];
    ctx.strokeStyle = CHART_TINT[s.k];
    ctx.lineWidth = pt(1);
    ctx.beginPath();
    ctx.moveTo(lx, box.y + pt(20));
    ctx.lineTo(lx + pt(14), box.y + pt(20));
    ctx.stroke();
    drawMarker(ctx, REPORT.markers[s.k], lx + pt(7), box.y + pt(20), pt(2));
    ctx.fillStyle = REPORT.ink;
    const label = elementName(s.k);
    ctx.fillText(label, lx + pt(18), box.y + pt(22.5));
    lx += pt(26) + ctx.measureText(label).width;
  }
  // Axes: hairlines, ticks outward.
  ctx.strokeStyle = REPORT.rule;
  ctx.lineWidth = pt(0.6);
  ctx.beginPath();
  ctx.moveTo(plot.x, plot.y);
  ctx.lineTo(plot.x, plot.y + plot.h);
  ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
  ctx.stroke();
  ctx.font = reportFont(7);
  ctx.textAlign = 'right';
  for (let v = 0; v <= max + 1e-9; v += step) {
    ctx.beginPath();
    ctx.moveTo(plot.x, sy(v));
    ctx.lineTo(plot.x - pt(2.5), sy(v));
    ctx.stroke();
    ctx.fillText(String(v), plot.x - pt(4), sy(v) + pt(2.5));
  }
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    ctx.beginPath();
    ctx.moveTo(sx(i), plot.y + plot.h);
    ctx.lineTo(sx(i), plot.y + plot.h + pt(2.5));
    ctx.stroke();
    ctx.fillText(String(i + 1), sx(i), plot.y + plot.h + pt(10));
  }
  ctx.fillText(xTitle, plot.x + plot.w / 2, plot.y + plot.h + pt(20));
  ctx.save();
  ctx.translate(box.x + pt(6), plot.y + plot.h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(`${t('Area fraction')} (%)`, 0, 0);
  ctx.restore();
  // Series, nudged sideways so error bars of different elements do not sit on top of each other.
  series.forEach((s, j) => {
    const offset = (j - (series.length - 1) / 2) * pt(3);
    ctx.strokeStyle = CHART_TINT[s.k];
    ctx.fillStyle = CHART_TINT[s.k];
    ctx.lineWidth = pt(0.75);
    for (const [i, p] of s.points.entries())
      if (p && p.n > 1) {
        const x = sx(i) + offset;
        ctx.beginPath();
        ctx.moveTo(x, sy(p.mean - p.sd));
        ctx.lineTo(x, sy(p.mean + p.sd));
        ctx.moveTo(x - pt(1.5), sy(p.mean - p.sd));
        ctx.lineTo(x + pt(1.5), sy(p.mean - p.sd));
        ctx.moveTo(x - pt(1.5), sy(p.mean + p.sd));
        ctx.lineTo(x + pt(1.5), sy(p.mean + p.sd));
        ctx.stroke();
      }
    ctx.lineWidth = pt(1);
    ctx.beginPath();
    let pen = false;
    for (const [i, p] of s.points.entries()) {
      if (!p) {
        pen = false;
        continue;
      }
      ctx[pen ? 'lineTo' : 'moveTo'](sx(i) + offset, sy(p.mean));
      pen = true;
    }
    ctx.stroke();
    for (const [i, p] of s.points.entries())
      if (p) drawMarker(ctx, REPORT.markers[s.k], sx(i) + offset, sy(p.mean), pt(2.1));
  });
  ctx.textAlign = 'left';
}
/* Three-line table of the figures: one row per element, one column per figure. Headers wrap to
   two lines; a figure no element has is left out. Returns the height used, or measures only. */
function drawFigureTable(ctx, box, r, keys, letter, measureOnly = false) {
  const unit = r.distance?.unit || '',
    columns = REPORT_ROWS.map(([label, read, digits]) => ({
      label: label === 'Median distance' ? `${t('Median Distance')} (${unit})` : t(label),
      values: keys.map(k => read(r, r.elements[k], k)),
      digits,
    })).filter(c => c.values.some(v => v != null && Number.isFinite(v))),
    firstW = box.w * 0.17,
    colW = (box.w - firstW) / columns.length,
    rowH = pt(11.5);
  ctx.font = reportFont(7, 700);
  const headers = columns.map(c => wrapText(ctx, c.label, colW - pt(4)).slice(0, 3)),
    headerH = Math.max(...headers.map(h => h.length)) * pt(8.5),
    height = pt(18) + headerH + pt(6) + keys.length * rowH + pt(6);
  if (measureOnly) return height;
  ctx.fillStyle = REPORT.ink;
  ctx.font = reportFont(10, 700);
  ctx.fillText(letter, box.x, box.y + pt(10));
  ctx.font = reportFont(8, 700);
  ctx.fillText(t('Figures of the whole analysed region'), box.x + pt(12), box.y + pt(10));
  let y = box.y + pt(16);
  const rule = width => {
    ctx.lineWidth = width;
    ctx.strokeStyle = REPORT.rule;
    ctx.beginPath();
    ctx.moveTo(box.x, y);
    ctx.lineTo(box.x + box.w, y);
    ctx.stroke();
  };
  rule(pt(1));
  ctx.font = reportFont(7, 700);
  ctx.textAlign = 'right';
  headers.forEach((lines, j) =>
    lines.forEach((line, l) =>
      ctx.fillText(line, box.x + firstW + colW * (j + 1), y + pt(9) + l * pt(8.5)),
    ),
  );
  ctx.textAlign = 'left';
  y += headerH + pt(4);
  rule(pt(0.5));
  ctx.font = reportFont(7);
  keys.forEach((k, i) => {
    const ry = y + (i + 1) * rowH;
    ctx.fillStyle = CHART_TINT[k];
    drawMarker(ctx, REPORT.markers[k], box.x + pt(3), ry - pt(2.5), pt(2));
    ctx.fillStyle = REPORT.ink;
    ctx.fillText(fitText(ctx, elementName(k), firstW - pt(10)), box.x + pt(9), ry);
    ctx.textAlign = 'right';
    columns.forEach((c, j) => {
      const v = c.values[i];
      ctx.fillText(
        v == null || !Number.isFinite(v) ? '—' : v.toFixed(c.digits),
        box.x + firstW + colW * (j + 1),
        ry,
      );
    });
    ctx.textAlign = 'left';
  });
  y += keys.length * rowH + pt(5);
  rule(pt(1));
  return height;
}
/* Mask panel with its grid shares and a scale bar. Small maps are enlarged by a whole factor
   without smoothing; larger ones are reduced with smoothing so mask detail is averaged, not
   dropped. */
function drawMaskPanel(ctx, box, r, key, letter, maxH) {
  const source = maskImage(key),
    fit = Math.min(box.w / source.width, maxH / source.height),
    scale = fit >= 1 ? Math.floor(fit) : fit,
    w = Math.round(source.width * scale),
    h = Math.round(source.height * scale),
    x = box.x,
    y = box.y + pt(14);
  ctx.fillStyle = REPORT.ink;
  ctx.font = reportFont(10, 700);
  ctx.fillText(letter, box.x, box.y + pt(10));
  ctx.font = reportFont(8, 700);
  ctx.fillText(
    fitText(ctx, `${elementName(key)} · ${t('area fraction per cell')} (%)`, box.w - pt(12)),
    box.x + pt(12),
    box.y + pt(10),
  );
  ctx.imageSmoothingEnabled = scale < 1;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, x, y, w, h);
  ctx.imageSmoothingEnabled = false;
  // Grid and the share in each cell.
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (const tile of r.tiles) {
    const tx = x + tile.x0 * scale,
      ty = y + tile.y0 * scale,
      tw = (tile.x1 - tile.x0) * scale,
      th = (tile.y1 - tile.y0) * scale;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = pt(0.4);
    ctx.strokeRect(tx, ty, tw, th);
    const share = tileShare(tile, key);
    if (!tile.area || share == null || tw < pt(16) || th < pt(8)) continue;
    const text = (share * 100).toFixed(1);
    ctx.font = reportFont(6.5, 700);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = pt(1.6);
    ctx.strokeText(text, tx + tw / 2, ty + th / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, tx + tw / 2, ty + th / 2);
  }
  ctx.textBaseline = 'alphabetic';
  // Scale bar under the image's lower right corner, clear of the cell numbers; without a
  // calibration, a note that distances are in pixels.
  const mark = scaleMark((w * 0.18) / scale);
  ctx.fillStyle = REPORT.ink;
  ctx.font = reportFont(7);
  ctx.textAlign = 'right';
  if (mark) {
    const length = mark.pixels * scale,
      label = `${mark.um} µm`,
      textW = ctx.measureText(label).width;
    ctx.fillText(label, x + w, y + h + pt(9));
    ctx.fillRect(x + w - textW - pt(4) - length, y + h + pt(5), length, pt(1.5));
  } else ctx.fillText(t('px, uncalibrated'), x + w, y + h + pt(9));
  ctx.textAlign = 'left';
  return pt(14) + h + pt(12);
}
/* The caption: what each panel is, how the error bars were made, and the methods. */
function reportCaption(r, keys, letters, later) {
  const trace = r.trace,
    seg = trace.segmentation,
    n = Math.round(Math.sqrt(r.tiles.length)),
    thresholds = ['nmc', ...keys]
      .map(
        k =>
          `${t(SHORT_NAMES[k])} ${seg[k].auto ? t('automatic') : `${t('manual')} ${Number(seg[k].threshold.toPrecision(4))}`}, ${t('averaging')} ${seg[k].denoise || 0} px`,
      )
      .join('; '),
    scale = trace.parameters.calibration
      ? `${Number(trace.parameters.calibration.toPrecision(4))} µm/px`
      : t('uncalibrated (px)'),
    region = trace.rois.length || trace.roiInvert ? t('user-defined region') : t('whole image'),
    small = cellSize(r).small ? ' ' + smallCellNote(r) : '';
  return [
    `${letters.length > 1 ? `${letters[0]}–${letters[letters.length - 1]}` : letters[0]}: ${t('Element masks (colour) over the micrograph; the main phase in magenta. Numbers are each cell’s area fraction of the element.')}`,
    `${later[0]}, ${later[1]}: ${t('Mean of the cell area fractions in each column (row) of the {n} × {n} grid; error bars ±1 SD over the {n} cells (spatial spread, not measurement uncertainty).').replaceAll('{n}', n)}`,
    `${later[2]}: ${t('Figures of the whole analysed region. CV is the population standard deviation divided by the mean.')}`,
    `${t('Methods')}: ${t('thresholds')} — ${thresholds}. ${t('Grid')} ${n} × ${n}; ${t('scale')} ${scale}; ${t('analysed area')}: ${region}.${small} ${t('2D image quantification')}. ${t('Electrode EDS Analyzer')} v${trace.toolVersion}, ${new Date(r.analyzedAt).toISOString().slice(0, 10)}.`,
  ];
}
function crc32(bytes) {
  let crc = -1;
  for (const b of bytes) {
    crc ^= b;
    for (let k = 0; k < 8; k++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
  }
  return (crc ^ -1) >>> 0;
}
/* PNG with a pHYs chunk, so Word and PowerPoint place it at its printed size. */
async function withResolution(blob, dpi) {
  const png = new Uint8Array(await blob.arrayBuffer()),
    perMetre = Math.round(dpi / 0.0254),
    chunk = new Uint8Array(21),
    view = new DataView(chunk.buffer);
  view.setUint32(0, 9);
  chunk.set([0x70, 0x48, 0x59, 0x73], 4); // pHYs
  view.setUint32(8, perMetre);
  view.setUint32(12, perMetre);
  chunk[16] = 1; // unit: metre
  view.setUint32(17, crc32(chunk.subarray(4, 17)));
  // IHDR is always first: 8-byte signature + 25-byte chunk.
  const out = new Uint8Array(png.length + chunk.length);
  out.set(png.subarray(0, 33));
  out.set(chunk, 33);
  out.set(png.subarray(33), 33 + chunk.length);
  return new Blob([out], { type: 'image/png' });
}
async function exportReport() {
  const r = state.results;
  if (!r || !baseChannel()) {
    status('請先完成分析。', true);
    return;
  }
  const keys = METRIC_KEYS.filter(k => r.elements?.[k]),
    letters = keys.map((_, i) => 'abc'[i]),
    // After the mask panels: the column profile, the row profile, the table.
    later = [...'abcdef'.slice(keys.length, keys.length + 3)],
    W = REPORT.width,
    M = REPORT.margin,
    leftW = Math.round((W - 2 * M - REPORT.gap) * 0.52),
    rightW = W - 2 * M - REPORT.gap - leftW,
    rightX = M + leftW + REPORT.gap,
    measure = document.createElement('canvas').getContext('2d');
  // Lay out first to know the height: header; mask panels beside the two profile charts, the
  // charts as tall as the panels; the table across the page; the caption.
  const headerH = pt(26),
    base = baseChannel(),
    maxPanel = Math.round((pt(420) - keys.length * pt(26)) / keys.length),
    fit = Math.min(leftW / base.w, maxPanel / base.h),
    scale = fit >= 1 ? Math.floor(fit) : fit,
    panelH = pt(14) + Math.round(base.h * scale) + pt(12),
    leftH = keys.length * (panelH + pt(8)),
    chartH = Math.max(pt(120), Math.min(pt(200), (leftH - pt(10)) / 2)),
    bodyH = Math.max(leftH, 2 * chartH + pt(10)),
    tableH = drawFigureTable(measure, { x: 0, y: 0, w: W - 2 * M }, r, keys, '', true);
  measure.font = reportFont(7);
  const caption = reportCaption(r, keys, letters, later).flatMap(p =>
      wrapText(measure, p, W - 2 * M),
    ),
    tableY = M + headerH + bodyH + pt(6),
    captionY = tableY + tableH + pt(10),
    H = captionY + caption.length * pt(9.5) + M;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = Math.round(H);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, canvas.height);
  ctx.textBaseline = 'alphabetic';
  // Header.
  ctx.fillStyle = REPORT.ink;
  ctx.font = reportFont(10, 700);
  ctx.fillText(
    fitText(ctx, `${state.sample} — ${t('EDS spatial distribution')}`, W - 2 * M),
    M,
    M + pt(10),
  );
  ctx.font = reportFont(7);
  ctx.fillStyle = REPORT.soft;
  ctx.fillText(
    [
      t(state.view === 'top' ? 'Top View' : 'Cross Section'),
      `${t('Additive')} ${t(state.material)}`,
      `${base.w} × ${base.h} px`,
      new Date(r.analyzedAt).toISOString().slice(0, 10),
    ].join(' · '),
    M,
    M + pt(20),
  );
  // Left: mask panels. Right: the column and row profiles.
  let y = M + headerH;
  keys.forEach((k, i) => {
    y += drawMaskPanel(ctx, { x: M, y, w: leftW }, r, k, letters[i], maxPanel) + pt(8);
  });
  const chartsTop = M + headerH;
  drawProfileChart(
    ctx,
    { x: rightX, y: chartsTop, w: rightW, h: chartH },
    r,
    keys,
    'x',
    later[0],
    t('Columns, image left to right'),
    t('Column'),
  );
  drawProfileChart(
    ctx,
    { x: rightX, y: chartsTop + chartH + pt(10), w: rightW, h: chartH },
    r,
    keys,
    'y',
    later[1],
    t('Rows, image top to bottom'),
    t('Row'),
  );
  // Table across the page.
  drawFigureTable(ctx, { x: M, y: tableY, w: W - 2 * M }, r, keys, later[2]);
  // Caption.
  let cy = captionY;
  ctx.fillStyle = REPORT.ink;
  ctx.font = reportFont(7);
  for (const line of caption) {
    cy += pt(9.5);
    ctx.fillText(line, M, cy - pt(2));
  }
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  download(safeName() + '.report.png', await withResolution(blob, REPORT.dpi));
  status('Report figure exported');
}

/* Language switching and start-up. */
function updateChrome() {
  document.documentElement.lang = language;
  document.title = t('Electrode EDS Analyzer');
  $('#language').value = language;
  for (const [id, key] of Object.entries({
    appName: 'Electrode EDS Analyzer',
    loadSession: 'Open project',
    save: 'Save Session',
    export: 'Export',
    settings: 'Settings',
    about: 'About',
    demoMenu: 'Load the synthetic example',
    pan: 'Pan',
    closeDialog: 'Close',
    opacityLabel: 'Opacity',
    baseLabel: 'Base',
  }))
    $('#' + id).textContent = t(key);
  for (const [id, key] of Object.entries({
    sample: 'Sample name',
    channel: 'Display channel',
    zoom: 'Zoom',
    opacity: 'Overlay opacity',
    collapse: 'Toggle results',
    more: 'More',
  }))
    $('#' + id).setAttribute('aria-label', t(key));
  document
    .querySelectorAll('[data-step] .label')
    .forEach(l => (l.textContent = t(STEP_LABELS[l.parentElement.dataset.step])));
  document
    .querySelectorAll('[data-display]')
    .forEach(b => (b.textContent = t(DISPLAY_LABELS[b.dataset.display])));
  renderEmpty();
  $('#zoom').querySelector('[value="fit"]').textContent = t('Fit');
  $('#pan').title = t('Pan');
  status(lastStatus, lastStatusError);
}
function changeLanguage(value) {
  if (!setUILanguage(value)) return;
  const transient = Object.fromEntries(
    ['roiMode'].filter(id => $('#' + id)).map(id => [id, $('#' + id).value]),
  );
  $('#tooltip').classList.add('hidden');
  $('#tooltip').classList.remove('pinned');
  updateChrome();
  renderControls();
  renderChannels();
  renderResults();
  for (const [id, value] of Object.entries(transient)) if ($('#' + id)) $('#' + id).value = value;
  draw();
  setupTooltips();
}
$('#language').onchange = e => changeLanguage(e.target.value);
updateChrome();
renderControls();
renderChannels();
draw();
setupTooltips();
</script></body></html>
